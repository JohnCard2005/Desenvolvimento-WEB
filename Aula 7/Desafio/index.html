<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Notas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <span class="icone">✦</span>
            <h1>Sistema de Notas</h1>
            <p>Calculadora de desempenho acadêmico</p>
        </header>

        <section class="card">

            <h2>Boletim do aluno</h2>

            <p class="descricao">
                Digite as três notas para calcular a média final.
            </p>

            <div class="campo">
                <label for="nota1">Primeira nota</label>
                <input type="number" id="nota1" placeholder="Ex.: 8.5" step="any">
            </div>

            <div class="campo">
                <label for="nota2">Segunda nota</label>
                <input type="number" id="nota2" placeholder="Ex.: 7.0" step="any">
            </div>

            <div class="campo">
                <label for="nota3">Terceira nota</label>
                <input type="number" id="nota3" placeholder="Ex.: 9.0" step="any">
            </div>

            <button type="button" id="calcular">
                Calcular média
                <span>→</span>
            </button>

            <div class="resultado-container">

                <p id="resultado" class="resultado">
                    O resultado aparecerá aqui.
                </p>

                <p id="finalizacao" class="finalizacao"></p>

            </div>

        </section>

        <footer>
            <p>Sistema de Notas • Avaliação acadêmica</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
